name: flutter_clean_arch_demo
description: >
  A Flutter demo app showcasing Clean Architecture with BLoC state management.
  Built for educational purposes — juniors can use this as a reference.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ───────────────────────────────────────────────────────
  flutter_bloc: ^8.1.3       # BLoC widgets (BlocBuilder, BlocProvider, etc.)
  bloc: ^8.1.2               # Core BLoC library

  # ─── Dependency Injection ───────────────────────────────────────────────────
  get_it: ^7.6.4             # Service locator — wires up the dependency graph

  # ─── Functional Programming ─────────────────────────────────────────────────
  dartz: ^0.10.1             # Either<Failure, Success> for clean error handling

  # ─── Networking ─────────────────────────────────────────────────────────────
  http: ^1.1.0               # HTTP client for remote API calls

  # ─── Local Storage ──────────────────────────────────────────────────────────
  shared_preferences: ^2.2.2 # Simple key-value storage for offline caching

  # ─── Connectivity ───────────────────────────────────────────────────────────
  connectivity_plus: ^5.0.2  # Detect network status (online / offline)

  # ─── Utilities ──────────────────────────────────────────────────────────────
  equatable: ^2.0.5          # Value equality without boilerplate
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.3            # Mocking for unit tests
  build_runner: ^2.4.7       # Code generation (needed by mockito)
  bloc_test: ^9.1.5          # Declarative BLoC unit testing

flutter:
  uses-material-design: true
